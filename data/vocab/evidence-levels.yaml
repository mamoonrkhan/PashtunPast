# Evidence levels — the KIND of evidence a citation provides.
#
# Important: these are TYPES, not a ladder. Genetics is not "better" than
# linguistics; each answers different questions. Genetics can tell us about
# ancestry but not what language someone spoke; linguistics can tell us about
# language history but not about biological ancestry.
#
# `max_strength` is the one place where types are ranked: a claim supported
# ONLY by these kinds of evidence cannot be rated stronger than this.
# (Strength order: weak < moderate < strong.)
#
# `plain` is the everyday wording shown on the website; `label` is the precise
# term, shown on hover and on the How it works page.
#
# Colours are from the Okabe–Ito palette, which stays distinguishable for
# people with colour-blindness. The site also always shows the `short` code
# and label, so colour is never the only signal.

- id: peer-reviewed-genetics
  label: Peer-reviewed genetics
  plain: DNA study
  short: GEN
  color: "#0072B2"
  max_strength: strong
  description: >
    Ancient or modern DNA studies published in peer-reviewed journals
    (e.g. admixture modelling, PCA, uniparental haplogroups). Preprints that
    have not been peer reviewed go under secondary-scholarship or speculative
    until published.

- id: linguistic-consensus
  label: Linguistic consensus
  plain: Language comparison
  short: LING
  color: "#009E73"
  max_strength: strong
  description: >
    Conclusions broadly accepted in historical linguistics, established by
    the comparative method (regular sound correspondences, shared grammar),
    as reflected in standard reference works.

- id: archaeology
  label: Archaeology
  plain: Archaeology
  short: ARCH
  color: "#E69F00"
  max_strength: strong
  description: >
    Excavated material evidence: settlements, burials, pottery, metallurgy,
    radiocarbon dates. Tells us about material culture, which does not
    automatically map onto language or ethnic identity.

- id: primary-historical-text
  label: Primary historical text
  plain: Ancient text
  short: TEXT
  color: "#56B4E9"
  max_strength: strong
  description: >
    A text or inscription from (or close to) the period in question, e.g.
    Herodotus, Achaemenid inscriptions, Bactrian documents. Strong evidence of
    what the author WROTE; how accurate the author was is a separate question.

- id: secondary-scholarship
  label: Secondary scholarship
  plain: Expert analysis
  short: SCHOL
  color: "#CC79A7"
  max_strength: strong
  description: >
    Analysis and interpretation by modern scholars (books, review articles,
    encyclopedia entries by specialists) that is not itself a primary dataset.

- id: oral-tradition
  label: Oral tradition / legend
  plain: Tradition or legend
  short: ORAL
  color: "#F0E442"
  max_strength: moderate
  description: >
    Genealogies, origin stories and legends passed down within a community.
    Valuable as evidence of what a community believes about itself; on its own
    it cannot establish ancient historical events.

- id: speculative
  label: Speculative / disputed
  plain: Speculation
  short: SPEC
  color: "#D55E00"
  max_strength: weak
  description: >
    Hypotheses without solid support, fringe theories, or arguments rejected
    by most specialists. Listed so readers can see them fairly, clearly labelled.
