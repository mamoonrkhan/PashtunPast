# The "big questions" on the Start here page, in plain language.
#
# Rules for this file:
#   - Each answer only summarises what the linked claims (and their sources) say.
#     No new facts here: if something needs saying, add or change a claim first.
#   - Write for someone with no background in history or linguistics.
#   - `where_it_stands` is one short line on how certain the answer is.
#   - The validator checks that every claim listed exists (rule G1).
#   - `section` groups questions on the page: origins | language | history | deep-past.

- id: pashto-language
  section: language
  question: Where does the Pashto language come from?
  answer: >
    Pashto belongs to the Iranian family of languages, the same family as
    Persian, but on a different branch. Linguists place it in the Eastern
    Iranian branch, alongside ancient languages such as Bactrian and the Saka
    languages, and with smaller languages still spoken in the Pamir mountains.
    Exactly which ancient language Pashto grew out of is still an open question.
  where_it_stands: "Its language family: well supported. Its exact ancestor: still open."
  claims: [pashto-eastern-iranian, saka-languages-eastern-iranian, pashto-from-saka-dialect, kushan-bactrian-language]

- id: scythians
  section: origins
  question: Did the Scythians (Sakas) help form the Pashtuns?
  answer: >
    "Saka" was the Persian name for the nomads the Greeks called Scythians. They
    spoke Iranian languages, close relatives of Pashto. Sakas lived right next to
    the Pashtun homeland (the region of Sistan was once "Sakastan", the land of
    the Sakas), and Saka kings ruled Gandhara and Arachosia about 2,000 years ago.
    That makes a Saka contribution to the Pashtuns quite possible. But it hasn't
    yet been tested directly. DNA shows the Sakas were themselves a mix that
    already included ancestry common in Afghanistan, which makes their trace
    harder to spot. The claim page explains what evidence would settle it.
  where_it_stands: "Plausible, with circumstantial support, but not yet tested directly."
  claims: [scythian-role-in-pashtun-origins, sakastan-land-of-the-sakas, indo-scythians-ruled-northwest, scythian-language-north-iranian, persians-called-scythians-saka, scythian-gene-pools-formed, scythian-expansion-moved-people, scythian-shares-d-to-l-with-pashto, pashtun-y-r1a-frequency, kushan-era-bactria-steppe-increase]

- id: paktyes
  section: origins
  question: Who were the Paktyes, and were they Pashtuns?
  answer: >
    About 2,500 years ago, the Greek historian Herodotus wrote about a people
    called the Paktyes, living on the eastern edge of the Persian Empire. The name
    sounds like "Pakhtun", and many people think they were early Pashtuns. That's
    possible, but it isn't proven: the link rests mostly on the similar name and
    the location, and Herodotus also uses a similar name for a place near Armenia.
  where_it_stands: "Herodotus's mention: well supported. That they were Pashtuns: disputed."
  claims: [herodotus-names-paktyes, paktyes-ancestors-of-pashtuns, herodotus-western-paktyike]

- id: first-records
  section: history
  question: When do the Pashtuns first appear in written records?
  answer: >
    Herodotus mentioned a people called the Paktyes about 2,500 years ago, but
    whether they were Pashtuns is disputed. The first clear mentions come much later,
    under the name "Afghans", which older writers used for the Pashtuns. A Persian
    geography of 982 CE mentions Afghans living near Gardiz; soon after, Mahmud of
    Ghazni had Afghans in his army, and around 1030 al-Bīrūnī described Afghan
    tribes in the mountains on India's western frontier. By 1504 Bābur listed
    "Afghani", that is Pashto, among the languages of Kabul. Older forms of the name
    have been suggested in Sanskrit and Bactrian texts, but still need checking.
  where_it_stands: "Clear mentions from the 10th century CE; earlier ones possible but unconfirmed."
  claims: [afghans-in-hudud-al-alam, afghans-in-ghaznavid-armies, afghans-in-al-biruni, babur-records-afghani-language, pashtun-pakhtun-name, earlier-forms-of-afghan-name, herodotus-names-paktyes, paktyes-ancestors-of-pashtuns]

- id: pashtun-states
  section: history
  question: Did Pashtuns ever rule kingdoms or empires?
  answer: >
    Yes, several times. The Lodi family ruled the Delhi Sultanate in northern India
    from 1451 to 1526, and Sher Shah Suri seized the throne of Delhi from the
    Mughals in the 16th century. In 1722 Afghans from Kandahar, led by Mahmud, son
    of Mir Wais, captured Isfahan and the Persian throne. And in 1747 Ahmad Shah
    Durrani was crowned at Kandahar, founding the Durrani kingdom.
  where_it_stands: "Well documented, though the sources used so far are old and need modern support."
  claims: [pashtun-dynasties-of-delhi, afghans-take-isfahan-1722, durrani-monarchy-founded-1747]

- id: pashto-written
  section: language
  question: When was Pashto first written down?
  answer: >
    By 1504 the emperor Bābur listed "Afghani", that is Pashto, as one of the
    languages of Kabul. In the later 1500s Bāyazīd Ansārī and his rival Akhund
    Darweza wrote religious works in Pashto, and a rich poetry followed. Khushal Khan Khattak,
    born in 1613, was both a tribal chief and a poet, and Rahman Baba became one of
    the best-loved Pashto poets. A collection called the Pata Khazana claims Pashto
    poems from as early as the 8th century, which would make written Pashto far
    older, but the atlas hasn't yet added scholarly assessments of it.
  where_it_stands: "From the 16th century: well supported. Much earlier writing: claimed, not yet assessed."
  claims: [classical-pashto-poetry, early-pashto-prose-bayazid-darweza, shaykh-mali-yusufzai-history, babur-records-afghani-language, pata-khazana-early-poetry]
- id: society
  section: history
  question: How do Pashtuns organise their society?
  answer: >
    Traditionally, Pashtun tribes trace their descent from one ancestor, Qais Abdur
    Rashid, and his three sons, Sarban, Batan and Ghurghusht, a family tree recorded
    in a history from around 1610. In 1815 a British envoy described tribes run by
    their chiefs (khans) and by councils of family heads called jirgas, and a code of
    conduct, Pashtunwali, with strong duties of honour and hospitality. These are old
    descriptions; modern studies still need adding.
  where_it_stands: "Well recorded in older sources; modern scholarship still to be added."
  claims: [genealogy-three-sons-of-qais, jirga-recorded-1815, pashtunwali-recorded-1815]
- id: dna
  section: deep-past
  question: What does ancient DNA tell us?
  answer: >
    DNA studies show that people in this region descend from several ancient
    groups, mainly early farmers of the Iranian plateau and Bronze Age herders
    from the steppe, whose ancestry reached the region about 3,500 to 4,000 years
    ago. Afghanistan's peoples, Pashtuns included, share deep common roots, with
    later migrations adding different layers to each group. In two studies, about
    half or more of Pashtun men carry the father's-line lineage R1a. DNA tells us about
    ancestry, not about language or identity, and only a few studies include
    Pashtuns.
  where_it_stands: "The broad picture: well supported. Pashtun-specific results: thin so far."
  claims: [afghan-groups-shared-roots, steppe-ancestry-into-south-asia, pashtuns-steppe-ancestry, pashtun-y-r1a-frequency, central-asian-iranian-speakers-continuity, iron-age-nomads-mixed-ancestry, bmac-little-steppe-ancestry]

- id: lost-tribes
  section: origins
  question: What about the Lost Tribes of Israel story?
  answer: >
    A Persian history written around 1610, the Makhzan-i Afghani, traces the
    Afghans back to King Talut (Saul) of the ancient Israelites. This tradition
    matters to many Pashtuns. Whether it is historically true is disputed. It was
    written down more than 2,000 years after the events it describes, Pashto is an
    Iranian language rather than a Semitic one, and the DNA studies so far explain
    Pashtun ancestry with regional and steppe sources. No study has yet tested the
    idea directly. The debate is old: in 1815 the British envoy Elphinstone already
    judged it to rest on "a vague tradition alone".
  where_it_stands: "That the tradition exists: well supported. That it is historically true: disputed."
  claims: [lost-tribes-tradition-makhzan, lost-tribes-descent, greek-descent-theory]

- id: bactria
  section: deep-past
  question: What were Bactria and the BMAC?
  answer: >
    Bactria was the land around the Amu Darya river, in today's northern
    Afghanistan and its neighbours. About 4,000 years ago it had towns and crafts
    that archaeologists call the BMAC (Bactria–Margiana Archaeological Complex).
    DNA shows these townspeople had little steppe ancestry. Much later, Bactrian
    became the official language of the Kushan Empire, written in Greek letters.
  where_it_stands: "Well supported, though nobody knows what language BMAC people spoke."
  claims: [bmac-little-steppe-ancestry, kushan-bactrian-language, andronovo-indo-iranians]

- id: greeks
  section: origins
  question: Are Pashtuns descended from Alexander the Great's Greek soldiers?
  answer: >
    Alexander the Great marched through Afghanistan and Pakistan around 330 BCE,
    and Greek kings ruled Bactria for about two centuries after him, so the idea
    is not far-fetched. Two DNA studies of Pashtun men's father's line have
    looked for it. One found a Greek-like lineage in a couple of men and
    concluded there may be a small Greek contribution; the other found nothing
    that supports Greek ancestry. Either way, any Greek share is small.
  where_it_stands: "A small Greek contribution is possible; a large one is not supported."
  claims: [greek-descent-theory, pashtun-y-r1a-frequency]
