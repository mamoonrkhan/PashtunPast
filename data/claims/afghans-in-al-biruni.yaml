id: afghans-in-al-biruni
title: Around 1030 CE, al-Bīrūnī placed Afghan tribes in the mountains on India's western frontier
plain: >
  The great scholar al-Bīrūnī, writing about India around 1030 CE, said that
  different Afghan tribes lived in the mountains along India's western edge,
  reaching down towards the Indus valley. This roughly matches where Pashtuns
  live today.
statement: >
  Al-Bīrūnī, writing about India around 1030 CE at the Ghaznavid court, states
  that "in the western frontier mountains of India there live various tribes of the
  Afghans, and extend up to the neighbourhood of the Sindh Valley".
discussion: >
  "Sindh Valley" here means the valley of the Indus. Al-Bīrūnī lived in Ghazni and
  knew the region at first hand, which makes this a valuable early description of
  where Afghan (Pashtun) tribes lived.
status: unverified
verification_note: >
