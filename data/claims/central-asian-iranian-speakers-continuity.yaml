id: central-asian-iranian-speakers-continuity
title: Iranian-speaking Tajiks and Yaghnobis largely descend from Iron Age people of the same region
plain: >
  DNA shows that today's Tajiks and Yaghnobis in Central Asia mostly descend from
  people who lived in the same area about 2,500 to 3,000 years ago. Yaghnobi is an
  Eastern Iranian language like Pashto. No similar test has yet been published for
  Pashtuns.
statement: >
  Present-day Yaghnobis and Tajiks, who speak Iranian languages, show strong genetic
  continuity with Iron Age people of Turkmenistan and Tajikistan. Yaghnobis are
  modelled as about 93% Iron Age Turkmenistan-related and 7% Baikal-related (East
  Asian) ancestry; Tajiks show more Baikal-related ancestry and an extra South Asian
  contribution.
discussion: >
  Yaghnobi is a living Eastern Iranian language, related to ancient Sogdian. The
  study shows one way to test where an Eastern Iranian-speaking people came from.
  Pashtuns were not included.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: read in the open-access abstract. Confirm the
  proportions in the results section and record which Iron Age samples were used.
