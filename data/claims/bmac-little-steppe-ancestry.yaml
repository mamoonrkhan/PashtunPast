id: bmac-little-steppe-ancestry
title: People of the BMAC had little or no steppe ancestry
plain: >
  About 4,000 years ago, towns flourished in what is now Turkmenistan, Uzbekistan and
  northern Afghanistan. DNA from their graves shows these townspeople had little or no
  ancestry from the steppe herders further north.
statement: >
  Most individuals sampled from Bronze Age BMAC sites have ancestry related to
  ancient Iranian and Anatolian farmers, with little or no steppe ancestry.
  A few outlier individuals show steppe ancestry, suggesting contact with
  steppe groups late in the Bronze Age.
discussion: >
  The BMAC is an archaeological culture, defined by its towns, crafts and
  burials. What language its people spoke is unknown.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: confirm the BMAC results and the outliers in
  Narasimhan 2019, and add chapter references from Lyonnet & Dubova 2020.
strength: strong
