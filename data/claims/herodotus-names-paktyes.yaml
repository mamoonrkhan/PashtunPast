id: herodotus-names-paktyes
title: Herodotus names a people called the Paktyes
statement: >
  Herodotus (5th century BCE) names a people called the Paktyes (Pactyes) among
  the contingents of Xerxes' army, and a land called Paktyike near the city of
  Kaspatyros, on the eastern side of the Persian Empire.
discussion: >
  This claim is only about what the text says. Whether these Paktyes were the
  ancestors of the Pashtuns is a separate, contested claim
  (paktyes-ancestors-of-pashtuns).
  Not to be confused with two unrelated uses of the same name in Herodotus: a
  Lydian man called Pactyes (1.153–161) and a town called Pactye on the
  Gallipoli peninsula (6.36).
status: unverified
verification_note: >
  UNVERIFIED — needs source check: a pre-check (2026-11-25, automated reading of
  the Godley translation in the Perseus TEI edition) found all cited passages
  saying what is cited: 3.102 and 4.44 (Caspatyrus and "the Pactyic country"),
  7.67 (the Pactyes' equipment and commander), 7.68 and 7.85 (other contingents
  compared with the Pactyes). A person should confirm these in a printed or
  Perseus edition and then mark this claim verified.
