id: sakastan-land-of-the-sakas
title: Sistan was named Sakastan, "land of the Sakas", next to Arachosia
statement: >
  The region of Sistan, in today's south-western Afghanistan and eastern Iran,
  takes its name from Sakastana, "land of the Sakas". The name is first recorded
  by Isidore of Charax around the turn of the era. Sakastan bordered Arachosia
  (the Kandahar region), part of the later Pashtun heartland.
discussion: >
  When Sakas first settled here is debated. The usual view links it to Saka
  migrations in the late 2nd century BCE; Thomas (1906) argued they were present
  earlier. Thomas's study is more than a century old, so later scholarship should
  be added before relying on his dating.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: Thomas 1906, pp. 188–191, was read in a
  scan. Add modern scholarship on the date of Saka settlement in Sistan, and
  ideally the passage in Isidore of Charax (Parthian Stations).
