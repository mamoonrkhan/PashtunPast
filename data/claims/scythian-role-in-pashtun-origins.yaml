id: scythian-role-in-pashtun-origins
title: Saka (Scythian) peoples were a major contributor to Pashtun origins
plain: >
  Did the Scythians (Sakas) help form the Pashtuns? There are good reasons to think it
  possible, but it hasn't been directly tested yet. This page sets out the evidence on
  both sides and how it could be tested.
statement: >
  Saka, or Scythian, peoples were a major contributor to the formation of the
  Pashtuns: to the Pashto language, to Pashtun ancestry, or to both.
discussion: >
  WHAT POINTS TOWARDS IT. Pashto belongs to the same Eastern Iranian branch as
  the Saka languages. Some linguists have proposed that Pashto comes from a Saka
  dialect, or was in close contact with one. Saka groups lived right next to the
  Pashtun homeland, in Sakastan beside Arachosia, and Saka kings ruled Gandhara
  and Arachosia in the 1st century BCE. More broadly, Scythians strongly
  influenced the Iranian world in the 1st millennium BCE. About half or more
  of Pashtun men carry the Y-chromosome lineage R1a (two studies), and Saka men buried in
  Kyrgyzstan also carried an R1a sub-branch, although R1a is far too widespread
  for this to prove a link on its own. In Kushan-era northern Bactria, people
  carried more steppe-related ancestry than the Bronze Age townspeople before them,
  a sign of movement from the northern steppe, though the study doesn't say which
  group it came from.

  WHAT COMPLICATES IT. "Saka" and "Scythian" were names for many different
  groups, and we don't know that they spoke one language. Language and ancestry
  are separate questions: Pashto could descend from a Saka dialect even if most
  Pashtun ancestry came from elsewhere, and the reverse is also possible. No
  genetic study cited here measures Saka-related ancestry in Pashtuns
  specifically. Most steppe-related ancestry in South Asia arrived in the 2nd
  millennium BCE, more than a thousand years before the Saka period, so
  steppe ancestry in Pashtuns today can't simply be credited to the Sakas.
  Sakas themselves carried a large share of southern Central Asian ancestry, much
  like the people already living in Afghanistan, so a Saka contribution would be
  hard to detect. Pashto's closest relatives within Eastern Iranian are also still
  debated.

  WHAT WOULD TEST IT. Genetics: published ancient genomes of Iron Age Saka
  groups could be used as a source in admixture models of Pashtun samples, and
  the date of mixing estimated; a contribution dated to the 1st millennium BCE or
  early centuries CE would support the idea. Linguistics: sound changes or words
  shared only by Pashto and the Saka languages (or Ossetian), and not by other
  Eastern Iranian languages, would point to a specifically Saka origin for Pashto.

  It is rated "disputed" (contested) because it is a live hypothesis with circumstantial
  support but has not been directly tested, and it competes with other accounts.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: find scholarship that directly argues for or
  against a Saka origin of Pashto or of the Pashtuns. Priority: Kreidl 2026, A
  Historical Grammar of Pashto, §6.3 "Pashto within the Eastern Iranian Languages"
  (p. 367) and §6.6 "Supposed Special Links between Saka and Pashto" (p. 372); also
  Cheung 2015 (both in the review queue, neither openly readable), and any genetic study modelling Pashtun ancestry
  with Iron Age Saka sources.
strength: contested
