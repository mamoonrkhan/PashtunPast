    evidence_level: secondary-scholarship
    relation: context
    locator: p. 189
    note: Scythians dominated Media and parts of the Near East in the 7th century BCE; whether all Saka/Scythian peoples spoke one language is unknown.
  - source: gnecchi-ruscone-2021
    evidence_level: peer-reviewed-genetics
    relation: context
    locator: Fig. 3 caption; section "Dating ancient admixture"
    note: Saka and Scythian gene pools mixed steppe, southern Central Asian (BMAC-related) and eastern ancestry; Tian Shan Sakas gained more BMAC-related ancestry over time.
  - source: haber-2012
    evidence_level: peer-reviewed-genetics
    relation: context
    locator: Results (haplogroup frequencies)
    note: R1a1a-M17 in about half of Pashtun men tested.
  - source: unterlander-2017
    evidence_level: peer-reviewed-genetics
    relation: context
    locator: Abstract
    note: Iron Age Scythian-related groups carried an East Asian-related component as well as Yamnaya-related ancestry, which a genetic test could look for.
