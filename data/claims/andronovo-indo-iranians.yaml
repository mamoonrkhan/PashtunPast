id: andronovo-indo-iranians
title: The Andronovo culture is linked to early Indo-Iranian speakers
plain: >
  The Andronovo culture was a group of Bronze Age communities on the Central Asian
  grasslands. Many scholars think its people were early speakers of the language
  family that later produced Persian, Sanskrit and Pashto, but others say graves and
  pottery alone can't tell us what language people spoke.
statement: >
  The Bronze Age Andronovo cultures of the steppe were associated with early
  speakers of Indo-Iranian languages, the family that later produced Avestan,
  Old Persian, Sanskrit and Pashto.
discussion: >
  This is a widely held view, but it connects material culture to language,
  which is always an inference rather than a direct observation. Critics argue
  the archaeological evidence cannot settle which cultures spoke Indo-Iranian.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: add chapter references for Kuzmina 2007 and
  Anthony 2007, and confirm Lamberg-Karlovsky 2002's position.
