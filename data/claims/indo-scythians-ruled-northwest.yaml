id: indo-scythians-ruled-northwest
title: Saka (Indo-Scythian) kings ruled Gandhara and Arachosia in the 1st century BCE
plain: >
  About 2,000 years ago, Saka kings, known today as Indo-Scythians, took control of
  Gandhara (around Peshawar) and, for a time, the Kandahar region.
statement: >
  In the 1st century BCE, Saka rulers known as Indo-Scythians, among them Maues
  and Azes, took over Gandhara and neighbouring lands from the Indo-Greeks, and
  Saka groups also held Arachosia for a time, before Indo-Parthian and then
  Kushan rule.
discussion: >
  This is widely stated, mainly on the evidence of coins and inscriptions, but
  the dates of individual kings differ between scholars by a decade or more. The
  source added so far shows that King Azes's coins come from Gandhara and eastern
  Afghanistan and that an era named after him began in 48/47 or 47/46 BCE (an
  older view put it at 58/57 BCE). It does not itself say that Azes or Maues were
  Sakas, or that Sakas held Arachosia, so the claim is rated only "weakly
  supported" until a source for those parts is added.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: Falk & Bennett 2009 was read (abstract and
  p. 198). Still needed: a source stating that Maues and Azes were Saka
  (Indo-Scythian) kings, and one for Saka rule in Arachosia (candidates: Dobbins
  1972; Encyclopaedia Iranica "Indo-Scythian dynasty"; both in the review queue).
