id: durrani-monarchy-founded-1747
title: Ahmad Shah Durrani was crowned at Kandahar in 1747, founding the Durrani monarchy
plain: >
  In 1747, after the Persian ruler Nadir Shah was murdered, the young Pashtun chief
  Ahmad Shah was crowned king at Kandahar. Rulers from the Durrani Pashtuns then
  governed Afghanistan until the 1970s.
statement: >
  After the murder of Nadir Shah in June 1747, Ahmad Shah, head of the Sadozai
  section of the Durrani (Abdali) Pashtuns, was crowned at Kandahar in October 1747,
  founding the Durrani monarchy.
discussion: >
  Elphinstone's history was written about 70 years later from Persian histories and
  interviews; a modern anthropologist confirms that Durrani Pashtun rulers governed
  Afghanistan from 1747 until the 1970s. Whether this monarchy should be called the
  start of modern Afghanistan is an interpretation that would need its own source.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: read in the OCR text of Elphinstone's Appendix A
  (c. p. 541) and in Tapper 2009 (p. 42). A modern history with the exact date of the
  coronation would strengthen it.
