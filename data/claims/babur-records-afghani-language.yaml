id: babur-records-afghani-language
title: In 1504, Bābur recorded "Afghani" among the languages of Kabul and placed Afghan tribes to its south
plain: >
  When Bābur took Kabul in 1504, he wrote in his memoirs that eleven or twelve
  languages were spoken there, one of them "Afghani", the language we call Pashto,
  and that the Afghan tribes lived to the south of Kabul.
statement: >
  Bābur's memoirs, describing Kabul in 1504–05, place "the Afghan tribes" to the
  south of Kabul and list "Afghani" among the eleven or twelve languages spoken in
  the Kabul country, alongside Arabic, Persian, Turki, Mughuli, Hindi, Pashai, Paraji,
  Gibri, Birki and Lamghani.
discussion: >
  "Afghani" here is generally understood to mean Pashto. Bābur's memoirs are a
  first-hand account, and later passages describe raids on named Afghan tribes such
  as the Ghilji and the Mahmand (Mohmand).
status: unverified
verification_note: >
