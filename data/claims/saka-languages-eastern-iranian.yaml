id: saka-languages-eastern-iranian
title: The Saka languages were Eastern Iranian
plain: >
  Documents written in the Saka languages, found in western China, show they belonged
  to the same Eastern Iranian branch as Pashto.
statement: >
  Documents in Khotanese and Tumshuqese, written in the Tarim Basin during the
  first millennium CE, show that these Saka languages were Eastern Iranian,
  in the same broad branch as Pashto.
discussion: >
  Being in the same branch makes Saka and Pashto related languages. It does
  not by itself show that Pashto descends from Saka (see
  pashto-from-saka-dialect).
status: unverified
verification_note: >
  UNVERIFIED — needs source check: find the Khotanese/Tumshuqese chapter in
  Schmitt 1989, its author and pages, and the date range of the documents.
strength: strong
category: linguistics
