id: herodotus-western-paktyike
title: Herodotus also lists a Paktyike next to the Armenians
plain: >
  Herodotus also uses the name "Paktyike" for a place listed next to Armenia, far to
  the west. So the name may have been used for more than one place, which makes the
  link to the Pashtuns less certain.
statement: >
  In his list of Persian tax districts, Herodotus groups a "Paktyike" with the
  Armenians, far to the west of the eastern Paktyike. So the name may refer to
  more than one place, or the passage may contain an error.
discussion: >
  This matters for the Paktyes–Pashtun question, because it means "Paktyes" in
  Herodotus may not always point to the same region or people.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: a pre-check (2026-11-25) of the Godley
  translation (Perseus TEI edition) found 3.93 reads "The thirteenth, the Pactyic
  country and Armenia and the lands adjoining as far as the Euxine sea". Still
  needed: a person to confirm it, and a secondary source on how scholars
  interpret this western Paktyike.
