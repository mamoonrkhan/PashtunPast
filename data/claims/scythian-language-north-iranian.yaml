id: scythian-language-north-iranian
title: The Scythians spoke an Iranian language whose only living descendant is Ossetian
plain: >
  The Scythians left almost no writing; we know their language mostly from names. It
  was an Iranian language, and its only living descendant is Ossetian, spoken in the
  Caucasus.
statement: >
  The language of the Scythians is known mainly from personal and tribal names
  recorded by Greek and Persian writers. Scholars treat it as Iranian, belonging
  to a northern branch whose only living descendant is Ossetian, spoken today in
  the Caucasus. Whether all the peoples called "Scythian" or "Saka" spoke one
  single language is not known.
discussion: >
  Because so little Scythian survives, linguists work backwards from Ossetian
  and check which of its sound changes already appear in ancient Scythian and
  Sarmatian names. The chain runs Scythian, then Sarmatian and Alanic (its
  "Middle Iranian" stage), then Ossetian: about thirty notes written in Alanic by a
  13th-century priest have cognates in modern Ossetic dialects, confirming that
  Ossetian continues Alanic. How the Scythian of the western steppe relates to the Saka
  languages later written in Khotan, and to other Eastern Iranian languages such
  as Pashto, is still debated.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: Lubotsky 2002, pp. 189–190, was read in the
  author's repository copy. Confirm against the published volume, and add a
  second source on how Scythian relates to the Saka languages (candidates are in
  the review queue).
