id: pashto-eastern-iranian
title: Pashto is an Eastern Iranian language
plain: >
  Pashto is related to Persian, but it is closer to other "Eastern Iranian" languages
  such as ancient Bactrian and the Saka languages, and to small languages still spoken
  in the Pamir mountains.
statement: >
  Pashto belongs to the Eastern branch of the Iranian languages, within the
  Indo-Iranian branch of Indo-European. Its closest relatives are other Eastern
  Iranian languages (such as the Pamir languages, Munji–Yidgha, and the extinct
  Bactrian, Sogdian and Saka), not Western Iranian languages like Persian.
discussion: >
  This classification rests on regular sound correspondences and shared
  features, worked out by the comparative method. It is a claim about the
  language's history, not about the biological ancestry of its speakers:
  people can change language over generations.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: the Pashto chapter in Schmitt 1989 is
  Skjærvø, "Pashto", pp. 384–410 (identified via Septfonds 2005). Read it, and the
  foreword of Morgenstierne 2003 (pp. V–VIII), to confirm the classification and the
  list of closest relatives.
strength: strong
