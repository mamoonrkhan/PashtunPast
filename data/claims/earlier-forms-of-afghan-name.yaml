id: earlier-forms-of-afghan-name
title: Earlier forms of the name "Afghan" may appear in Sanskrit and Bactrian texts
plain: >
  The name "Afghan" may appear even earlier than the 10th century. A 6th-century
  Indian astrology book lists a people that its 19th-century translator called
  "Afghans", and a form "Abgān" has been reported in Bactrian documents. Both still
  need checking, so the idea is only weakly supported.
statement: >
  Forms of the name "Afghan" may occur in sources older than the 10th century. The
  6th-century Sanskrit Bṛhat Saṃhitā of Varāhamihira lists, among peoples assigned
  to the planet Ketu, one that Kern's 19th-century English translation renders as
  "Afghans" (the Sanskrit form is usually given as Avagāṇa). A form "Abgān" has
  also been reported in Bactrian documents from northern Afghanistan.
discussion: >
  The Sanskrit list is real, but "Afghans" is the translator's identification of a
  Sanskrit name, and the translation page doesn't show the Sanskrit word. Kern also
  renders other names in the same chapter as "Scythians" and "Greeks". The Bactrian
  form has no source here yet. Similar-sounding names can be coincidences, as the
  Paktyes question shows, so both need checking in reliable editions.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: Kern's translation was read (ch. XVI, vv. 38–39,
  p. 235). Still needed: the Sanskrit word in the original (Kern's 1865 edition or a
  modern one), a modern study of the identification, and the Bactrian document(s)
  with "Abgān" in Sims-Williams's editions.
