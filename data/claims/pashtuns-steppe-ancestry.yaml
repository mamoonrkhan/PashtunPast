id: pashtuns-steppe-ancestry
title: Modern Pashtun samples carry substantial steppe-related ancestry
plain: >
  DNA studies suggest Pashtuns have more ancestry from ancient steppe herders than
  most South Asian groups. This still needs checking against the original study, and
  the samples were few.
statement: >
  In published genetic studies, modern Pashtun ("Pathan") samples are modelled
  as a mix of Iranian-farmer-related ancestry, Steppe_MLBA ancestry and South
  Asian hunter-gatherer-related ancestry, with steppe ancestry among the higher
  levels seen in South Asia.
discussion: >
  Small samples from a few places cannot represent all Pashtuns, and mixture
  models describe ancestry sources, not ethnic or national identities.
status: unverified
verification_note: >
  UNVERIFIED — needs source check: find the Pathan samples in Narasimhan 2019's
  supplementary tables; record the sample size, where the samples came from and
  the estimated proportions. Downgrade this claim if the paper doesn't support it.
