title: "Tribe and state in Iran and Afghanistan: an Update"
authors:
  - "Tapper, Richard"
year: 2009
source_type: journal-article
peer_reviewed: true
venue: Études rurales
volume: "184"
pages: 33–46
doi: 10.4000/etudesrurales.10461
