summary: >
  An anthropologist's overview of how "tribes" have worked in Iran and Afghanistan:
  descent ideologies alongside territory and politics, and the relationship between
  tribes and states, including Durrani Pashtun rule in Afghanistan.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 (OpenEdition PDF). p. 34: the Durrani Pashtuns ("over 2 million") have
    been called a 'tribe' on grounds of descent. p. 37: most tribes had "some form of
    segmentary descent ideology", but "tended to ascribe common descent to all those who, by
    whatever means, had acquired rights in their territory". p. 42: "From 1747 until the
    1970s, Afghanistan was ruled by Amirs and Shahs from the Durrani Pashtuns".
