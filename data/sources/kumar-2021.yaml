id: kumar-2021
title: Genetic Continuity of Bronze Age Ancestry with Increased Steppe-Related Ancestry in Late Iron Age Uzbekistan
authors:
  - "Kumar, Vikas"
  - "et al."
year: 2021
source_type: journal-article
peer_reviewed: true
venue: Molecular Biology and Evolution
volume: "38"
issue: "11"
pages: 4908–4917
doi: 10.1093/molbev/msab216
open_access: true
summary: >
  Genome-wide data from 27 people buried at three sites in southern Uzbekistan
  around the Kushan period. Finds that Bronze Age ancestry continued, with more
  steppe-related ancestry than in the earlier BMAC towns.
verification:
  status: unverified
  notes: >
    Abstract read 2026-11-26 via Europe PMC (PMC8557446). Abstract: 27 Late Iron Age
    individuals (c. 2100–1500 BP) from three sites in South Uzbekistan; Bronze Age ancestry
    persists with no major replacement; higher Steppe-related ancestry than BMAC, suggesting
    southward movement from the northern steppe.
