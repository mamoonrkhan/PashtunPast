id: krusinski-1733
title: "The History of the Late Revolutions of Persia: Taken from the Memoirs of Father Krusinski, Procurator of the Jesuits at Ispahan (2 vols, 2nd edition)"
authors:
  - "Krusiński, Judasz Tadeusz"
  - "et al."
year: 1733
source_type: primary-text
peer_reviewed: false
venue: J. Pemberton, London
edition: >
  English edition of a history compiled by an unnamed editor from the memoirs of the
  Polish Jesuit Jude Krusinski, who lived about twenty years in Isfahan and left only
  near the end of the Afghan siege of 1722. An eyewitness-based, near-contemporary
  account, but written from the Persian court's side and through an editor.
url: https://archive.org/details/historyoflaterev01krusiala
summary: >
  Near-contemporary account of the rebellion of the Afghans of Kandahar under Mir Wais
  and the conquest of Isfahan by his son Mahmud in 1722.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 in the Internet Archive scans' OCR text (vol. I and vol. II; old long-s
    spelling). Vol. I preface: the Safavid kings reigned "to the Month of October 1722, when
    Schah-Hussein, the last King of that Race was dethroned"; the second part covers "the
    Intrigues of Myrr-Weis, Father to Maghmud, as well at Ispahan as Candahar … to the Moment
    that his Son Maghmud set out from Candahar … to besiege Kirman first, and then Ispahan".
    Vol. II: Mahmud's army ready "in December 1721"; "Sultan Maghmud … made his Entry into
    the Capital with all the Splendour of a Conqueror … plac'd himself on the Throne".
    Vol. II scan: https://archive.org/details/historyoflaterev02krusiala. Page numbers not
    recoverable from the OCR.
