title: Genetic continuity of Indo-Iranian speakers since the Iron Age in southern Central Asia
authors: ["Guarino-Vignon, Perle", "et al."]
year: 2022
source_type: journal-article
peer_reviewed: true
venue: Scientific Reports
volume: "12"
pages: "733"
doi: 10.1038/s41598-021-04144-4
open_access: true
summary: >
  Compares present-day Yaghnobis and Tajiks (Indo-Iranian speakers of Central Asia)
  with ancient genomes, and finds strong continuity with Iron Age people of
  Turkmenistan and Tajikistan.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 in the open-access full text (Europe PMC). Abstract: strong genetic continuity with Iron Age samples from Turkmenistan and
    Tajikistan; Yaghnobis modelled as 93% Iron Age Turkmenistan + 7% Baikal; Tajiks with
    more Baikal ancestry and a South Asian admixture. Article number 733 to be confirmed.
