  notes: >
    Read 2026-11-28 (OpenEdition; CC BY-SA 4.0). § 1: a revised and expanded second version
    of Morgenstierne's 1927 Etymological Vocabulary of Pashto. § 2: completed after
    Morgenstierne (d. 1978) and MacKenzie (d. 2001) by J. Elfenbein, with N. Sims-Williams as
    editor and P. O. Skjærvø as reader. § 3: foreword pp. V–VIII; abbreviations pp. 1–4;
    references pp. 5–6; the etymological vocabulary pp. 7–106; index pp. 107–140; for
    historical phonology the reader is referred to P. O. Skjærvø 1989, "Pashto", Compendium
    Linguarum Iranicarum, pp. 384–410.
