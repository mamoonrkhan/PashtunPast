verification:
  status: unverified
  notes: >
    Read 2026-11-26 (Internet Archive scan of the JRAS article). Chapter XVI, "Countries,
    People, and Things belonging to the Domain of each Planet", vv. 38–39 (p. 235): the
    domain of Ketu includes "the Pahlavas, Çvetas, Huns, Colas, Afghans, the Desert,
    Chinese…". The page does not give the Sanskrit word Kern translated as "Afghans";
    check the Sanskrit text (Kern's 1865 edition) to confirm it is Avagāṇa.
