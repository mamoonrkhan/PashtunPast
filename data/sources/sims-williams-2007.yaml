id: sims-williams-2007
title: "Bactrian Documents from Northern Afghanistan II: Letters and Buddhist Texts"
authors:
  - "Sims-Williams, Nicholas"
year: 2007
source_type: book
peer_reviewed: true
venue: The Nour Foundation, London (Studies in the Khalili Collection III; Corpus Inscriptionum Iranicarum, Part II)
summary: >
  Edition and translation of 79 Bactrian letters and Buddhist texts, mostly from the
  small kingdom of Rob on the north side of the Hindu Kush, with a grammar and a
  glossary covering all known Bactrian documents. Used for the Bactrian words in the
  cognate table.
verification:
  status: unverified
  notes: >
    2026-11-28: Étienne de La Vaissière's summary in Abstracta Iranica 30 (2010), document 22
    (doi 10.4000/abstractairanica.37557), read on OpenEdition, confirms London, The Nour
    Foundation, 2007, in Studies in the Khalili Collection III / Corpus Inscriptionum
    Iranicarum; the volume contains a grammar and "un glossaire (qui couvre tous les documents
    connus)" (a glossary covering all known documents); 79 texts, mostly from Rob, some from
    Juzjan. The book itself has not been read; the glossary entries for the cited Bactrian
    words still need checking.
