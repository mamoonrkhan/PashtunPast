summary: >
  A scholarly summary of Lubotsky's edition of about thirty Alanic notes written by an
  Alan priest in the margins of a 13th-century Greek manuscript, the longest early
  record of the Alanic language.
verification:
  status: unverified
  notes: >
    Read 2026-11-28 (OpenEdition). § 1: some thirty Alanic marginal notes in a 13th-century
    Greek manuscript (Q12, St Petersburg). § 3: "most of the Alanic words analysed have a
    cognate in modern Ossetic dialects, which proves once more the direct filiation between
    both of these languages, and moreover their almost perfect identification". Lubotsky's
    book itself has not been read.
