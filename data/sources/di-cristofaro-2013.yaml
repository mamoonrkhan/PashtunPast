id: di-cristofaro-2013
title: "Afghan Hindu Kush: Where Eurasian Sub-Continent Gene Flows Converge"
authors: ["Di Cristofaro, Julie", "et al."]
year: 2013
source_type: journal-article
peer_reviewed: true
venue: PLoS ONE
volume: "8"
