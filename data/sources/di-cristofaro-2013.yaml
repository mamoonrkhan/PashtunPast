summary: >
  Mitochondrial, Y-chromosome and some genome-wide data from over 500 people of five
  Afghan ethnic groups. Describes Afghans as a mosaic of Eurasian ancestries and the
  Hindu Kush as a meeting point of gene flows.
verification:
