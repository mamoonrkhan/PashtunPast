id: juras-2017
title: Diverse origin of mitochondrial lineages in Iron Age Black Sea Scythians
authors: ["Juras, Anna", "et al."]
year: 2017
source_type: journal-article
peer_reviewed: true
venue: Scientific Reports
volume: "7"
pages: "43950"
doi: 10.1038/srep43950
open_access: true
summary: >
  19 complete mitochondrial genomes of Scythians from the northern Black Sea
  region, compared with Saka and Pazyryk groups. Finds lineages of diverse origin
  and opposite west-to-east gradients of western and eastern lineages.
verification:
  status: unverified
  notes: >
    Abstract read 2026-11-26 via Europe PMC. Abstract: 19 whole mtDNA genomes; three potential ancestries (east and west Eurasian
    hunter-gatherers and nomads, Neolithic farmers); shared mtDNA package with Saka and
    Pazyryk; west Eurasian lineages decline west to east, east Eurasian lineages the opposite.
