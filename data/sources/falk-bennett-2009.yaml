id: falk-bennett-2009
title: Macedonian Intercalary Months and the Era of Azes
authors:
  - "Falk, Harry"
  - "Bennett, Chris"
year: 2009
source_type: journal-article
peer_reviewed: true
venue: Acta Orientalia
volume: "70"
pages: 197–216
url: https://journals.uio.no/actaorientalia/article/view/5339
open_access: true
summary: >
  Re-dates the era named after King Azes, known from coins found in Gandhara and
  eastern Afghanistan, using a newly read reliquary inscription with a Macedonian
  calendar month. Places the start of the era in 48/47 or 47/46 BCE.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 (journal PDF, University of Oslo). Abstract: Azes era start "in 48/7
    (autumn-based year) or 47/6 BC (spring-based year)"; p. 198: Azes known from coins
    collected "in Gandhara proper and eastern Afghanistan", inscribed AZOY and ayasa;
    a Macedonian calendar used "under the Indo-Scythians, the Indo-Parthians and the
    Kushans". The paper does not itself state that Azes was a Saka. OpenAlex lists the year
    wrongly as 1970; the PDF header gives 2009. No DOI found.
