id: elphinstone-1815
title: "An Account of the Kingdom of Caubul, and its Dependencies in Persia, Tartary, and India; comprising a View of the Afghaun Nation, and a History of the Dooraunee Monarchy"
authors:
  - "Elphinstone, Mountstuart"
year: 1815
source_type: book
peer_reviewed: false
venue: Longman, Hurst, Rees, Orme, and Brown, London
url: https://archive.org/details/bub_gb_FOc-AAAAYAAJ
summary: >
  The first detailed European account of the Pashtuns, based on Elphinstone's 1808–09
  embassy to the Durrani king and on interviews and Persian and Pashto histories.
  Describes the people, tribes, language and traditions, with a history of the Durrani
  monarchy. Valuable, but a 19th-century colonial-era work to be read critically.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 in the Internet Archive scan (1815 first edition; OCR is noisy). p. 151:
    "Their own name for their nation is Pooshtoon … The Berdooraunees pronounce this word
    Pookhtauneh; whence the name of Patan … may probably be derived." c. pp. 155–156: the
    Jewish-descent theory "is plausible, and may be true; but when closely examined it will
    appear to rest on a vague tradition alone"; the genealogy allows "only thirty-seven
    generations for a period of sixteen hundred years"; Sir William Jones was inclined to
    believe it. Appendix A, c. p. 541: "In October 1747 he [Ahmad Shah] was crowned at
    Candahar". Page numbers from OCR headers; confirm against the scan.
