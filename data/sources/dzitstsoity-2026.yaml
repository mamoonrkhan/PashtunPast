id: dzitstsoity-2026
title: On the dialectal division of Scythian
authors:
  - "Dzitstsoity, Yuriy A."
year: 2026
source_type: journal-article
peer_reviewed: true
venue: Indo-Iranian Languages
volume: "2"
issue: "1"
pages: 167–197
doi: 10.30842/30346800.2026.2.1.8
open_access: true
summary: >
  Argues that Scythian had at least two dialects, of which only one ("Skolot")
  changed Proto-Iranian *d into l, a change also found in Bactrian and Pashto.
  Disagrees with scholars who treat *d > l as a feature of all Scythian.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 (journal PDF; article in Russian with an English abstract, p. 168).
    English abstract: Scythian's Iranian nature is established; at least two dialects,
    Skolot and Shkuda (Dyakonov, Szemerényi, Grantovsky); the Skolot dialect developed
    Proto-Iranian *d into l, "which is also attested in Bactrian, Pashto and other
    languages", placing it with the south-eastern branch; Witczak, Kullanda and others treat
    *d > l as characteristic of Scythian as a whole. The Russian body text was not checked
    by a Russian reader.
