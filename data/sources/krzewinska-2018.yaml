id: krzewinska-2018
title: Ancient genomes suggest the eastern Pontic-Caspian steppe as the source of western Iron Age nomads
authors: ["Krzewińska, Maja", "et al."]
year: 2018
source_type: journal-article
peer_reviewed: true
venue: Science Advances
volume: "4"
issue: "10"
pages: eaat4457
doi: 10.1126/sciadv.aat4457
open_access: true
summary: >
  35 genomes of Bronze Age people and Iron Age Cimmerians, Scythians and
  Sarmatians from the Pontic-Caspian steppe. The nomads were genetically mixed,
  with links to the Far East and the southern Urals.
