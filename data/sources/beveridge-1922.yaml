year: 1922
source_type: translation
peer_reviewed: false
venue: Luzac & Co., London
edition: >
  English translation of the Turki memoirs of Bābur (1483–1530), founder of the Mughal
  dynasty, who ruled Kabul from 1504. Page numbers refer to this edition; folio numbers
  (f.) to the manuscript, as printed in the margin.
url: https://archive.org/details/baburnamainengli01babuuoft
summary: >
  Bābur's own memoirs, with first-hand descriptions of Kabul and its peoples, including
  the Afghan tribes and their language, from 1504 onwards.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 in the Internet Archive scan's OCR text. p. 207 (f. 131b), under 910 AH
    (1504–05 CE), "Inhabitants of Kabul": "To the south are the places of the Afghan tribes.
    Eleven or twelve tongues are spoken in Kabul,—'Arabi, Persian, Turki, Mughuli, Hindi,
    Afghani, Pashai, Paraji, Gibri, Birki and Lamghani." Confirm against the page image.
