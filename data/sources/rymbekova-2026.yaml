title: Genomic insights into the Iron Age Saka of Boz-Barmak, Kyrgyzstan
authors: ["Rymbekova, Ayshin", "et al."]
year: 2026
source_type: journal-article
peer_reviewed: true
venue: Scientific Reports
volume: "16"
pages: "33079"
doi: 10.1038/s41598-026-62891-8
open_access: true
summary: >
  Ancient DNA from 12 people buried at a Saka cemetery in Kyrgyzstan (4th–2nd
  centuries BCE). All the men share one Y-chromosome lineage while the women's
  lineages are varied, pointing to communities where men stayed and women moved in.
