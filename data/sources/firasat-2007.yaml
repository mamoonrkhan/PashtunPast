id: firasat-2007
title: Y-chromosomal evidence for a limited Greek contribution to the Pathan population of Pakistan
authors:
  - "Firasat, Sadaf"
  - "et al."
year: 2007
source_type: journal-article
peer_reviewed: true
venue: European Journal of Human Genetics
volume: "15"
issue: "1"
pages: 121–126
doi: 10.1038/sj.ejhg.5201726
summary: >
  Tests the claim of Burusho, Kalash and Pathans to descend from Alexander's Greek
  soldiers, using Y chromosomes from 952 men including 77 Greeks. Finds a Greek-like
  lineage in two Pathan men and concludes there may be a small European contribution.
verification:
  status: unverified
  notes: >
    Abstract read 2026-11-26 via Europe PMC (full text not available through the API).
    Abstract: earlier studies excluded a substantial Greek input; lowest genetic distances
    between Greeks and Pathans; E3b1 lineages in two Pathan individuals, one sharing a
    16-STR haplotype with Greeks; "strong evidence for a European origin for a small
    proportion of the Pathan Y chromosomes". A person should read the full paper.
