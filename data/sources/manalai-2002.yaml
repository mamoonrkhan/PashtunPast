summary: >
  A short scholarly summary, in French, of Zalmay Hewādmal's history of Pashto
  literature in its early and middle periods (2000), originally an Afghan
  secondary-school textbook (1990).
verification:
  status: unverified
  notes: >
    Read 2026-11-26 (OpenEdition; text under CC BY-SA 4.0). The book covers Pashto literature
    "entre le 8e et le 19e s."; "La première période, du 8e au 16e s. est connue à travers
    quelques rares textes", with three centres (Ghor, the Sulaiman mountains and Multan); the
    second period opens with the movement of Pir Roshan. The summary does not mention the
    Pata Khazana. Hewādmal's book itself has not been read.
