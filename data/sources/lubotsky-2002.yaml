id: lubotsky-2002
title: Scythian elements in Old Iranian
authors:
  - "Lubotsky, Alexander"
year: 2002
source_type: book-chapter
peer_reviewed: true
venue: "Sims-Williams, N. (ed.), Indo-Iranian Languages and Peoples (Proceedings of the British Academy 116), Oxford University Press"
pages: 189–202
doi: 10.5871/bacad/9780197262856.003.0009
url: https://hdl.handle.net/1887/16379
open_access: true
summary: >
  Asks whether Avestan and Old Persian borrowed words from Scythian. Sets out how
  little is known of the Scythian language (mostly personal and tribal names) and
  argues that Ossetic, its only modern descendant, is the firm starting point.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 in the Leiden repository copy (author version; pagination as
    published, pp. 189–202). p. 189: steppe tribes "called Sakas by the Persians and
    Scythians by the Greek"; "We do not know whether these peoples spoke the same
    language". p. 190: "Ossetic, the modern representative of one of the Scythian
    dialects"; footnote 1 defines 'Scythian' as the Old Iranian stage (c. 10th–3rd
    centuries BCE) of the North Iranian dialects. The paper does not discuss Pashto.
    A person should confirm against the published volume.
