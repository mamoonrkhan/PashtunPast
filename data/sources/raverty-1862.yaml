id: raverty-1862
title: "Selections from the Poetry of the Afghans, from the Sixteenth to the Nineteenth Century, Literally Translated from the Original Pushto"
authors:
  - "Raverty, H. G."
year: 1862
source_type: book
peer_reviewed: false
venue: Williams and Norgate, London
url: https://archive.org/details/selectionsfrompo00raverich
summary: >
  The first large English anthology of classical Pashto poetry, with biographical
  notices of the poets, including Khushal Khan Khattak and 'Abd-ur-Rahman (Rahman Baba).
  A 19th-century colonial-era work; use for what it records, read critically.
