  notes: >
    Read 2026-11-26 in the Internet Archive scan's OCR text (page headers not recoverable).
    Notice of "Khushhal Khan, Khattak": "the renowned chieftain of the powerful Afghan tribe
    of Khattak — alike a warrior and a poet — was born in the year 1022 of the Hijrah (A.D.
    1613)"; later resigned the chieftainship to his son Ashraf. Notice of 'Abd-ur-Rahman:
    "one of the most popular, and probably the best known, of all the Afghan poets"; of the
    Mohmand tribe, village of Hazar-Khani, Peshawar district. Publisher to be confirmed from
