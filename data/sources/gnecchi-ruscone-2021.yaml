id: gnecchi-ruscone-2021
title: Ancient genomic time transect from the Central Asian Steppe unravels the history of the Scythians
authors: ["Gnecchi-Ruscone, Guido Alberto", "et al."]
year: 2021
source_type: journal-article
peer_reviewed: true
venue: Science Advances
volume: "7"
issue: "13"
pages: eabe4414
doi: 10.1126/sciadv.abe4414
open_access: true
summary: >
  Genome-wide data from 111 ancient people at 39 sites across the Kazakh steppe,
  from the 1st millennium BCE to the 1st millennium CE. Shows how the Scythian and
  Saka gene pools formed in the Late Bronze Age and later changed.
verification:
