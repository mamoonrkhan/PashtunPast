id: jarve-2019
title: Shifts in the Genetic Landscape of the Western Eurasian Steppe Associated with the Beginning and End of the Scythian Dominance
authors: ["Järve, Mari", "et al."]
year: 2019
source_type: journal-article
peer_reviewed: true
venue: Current Biology
volume: "29"
issue: "14"
pages: 2430–2441.e10
doi: 10.1016/j.cub.2019.06.019
summary: >
  Whole genomes of 31 ancient people from the western and eastern steppe, before,
  during and after the Scythian period. Finds a rise in eastern (Altai) ancestry at
  the start of Scythian dominance, implying movement of people.
verification:
  status: unverified
  notes: >
    Abstract read 2026-11-26 via Europe PMC. Abstract: 31 whole genomes; increase of eastern (Altaian) affinity and decrease of
    EHG ancestry at the start of Scythian dominance; "the Scythian dominance did involve a
    demic component".
