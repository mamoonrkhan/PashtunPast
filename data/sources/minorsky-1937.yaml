id: minorsky-1937
title: "Ḥudūd al-ʿĀlam, 'The Regions of the World': A Persian Geography, 372 A.H. – 982 A.D."
authors:
  - "Minorsky, V. (trans.)"
year: 1937
source_type: translation
peer_reviewed: false
venue: Luzac & Co., London (E. J. W. Gibb Memorial, New Series XI)
edition: >
  English translation with commentary of an anonymous Persian geography written in
  982–983 CE in Guzganan (northern Afghanistan), with a preface by V. V. Barthold (1930).
url: https://archive.org/details/in.ernet.dli.2015.281514
summary: >
  Translation of a 10th-century Persian description of the known world, which
  includes one of the earliest surviving mentions of the Afghans as a people.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 in the Internet Archive scan's OCR text. § 10.48 (manuscript fol. 16a,
    p. 91 of the translation, between page headers 90 and 92): "SAUL, a pleasant village on a
    mountain. In it live Afghans." Barthold's preface (p. 30) says the Afghans are "mentioned
    as a people" and that 'Utbi was previously considered the oldest author to mention them.
    Page numbers come from OCR; confirm against the scan.
