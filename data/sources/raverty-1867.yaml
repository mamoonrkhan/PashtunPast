id: raverty-1867
title: "A Grammar of the Pukhto, Pushto, or Language of the Afghans (3rd edition)"
authors:
  - "Raverty, H. G."
year: 1867
source_type: book
peer_reviewed: false
venue: Williams and Norgate, London
url: https://archive.org/details/grammarofpukhtop00rave
summary: >
  A 19th-century grammar of Pashto whose introduction surveys Pashto literature,
  including the earliest prose authors Raverty could identify. A colonial-era work;
  use for what it records, read critically.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 in the Internet Archive scan's OCR text (University of Toronto copy).
    Introduction, p. 32: "The most ancient author amongst the Eastern Afghans, that I am
    able to discover, is Shaykh Mali, a chief of the Yusufzis", who wrote a history of the
    conquest of Suwat "between the years 816 and 828 of the Hijrah — A.D. 1413 to 1424";
    Khan Kaju (chief from 1494) also wrote one; "Both these works are extensive, but they
    are not procurable." pp. 32–33: Bayazid Ansari (Pir Roshan), founder of the Roshanian
    sect in Akbar's reign, wrote the Khair-ul-Bayan "in four languages — Pushto or Afghani,
    Arabic, Persian, and Hindi"; most copies burnt; Akhund Darwezah wrote the
    Makhzan-ul-asrar (which Raverty says is also called "Makhzan Afghani"; not the same
    work as Ni'mat Allah's Makhzan-i Afghani) to refute him.
