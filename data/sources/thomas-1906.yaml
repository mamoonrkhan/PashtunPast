summary: >
  Classic study of where the Sakas named by Darius and Herodotus lived. Discusses
  Sakastana (modern Sistan) and argues that Sakas were in south-eastern Iran and
  Afghanistan earlier than the usually assumed late-2nd-century-BCE migration.
verification:
  status: unverified
  notes: >
    Read 2026-11-26 (Zenodo scan). pp. 188–189: Sakas' settlement in "this region,
    afterwards known as Sakastana, now Sistan"; the name "is first recorded by Isidor
    of Charax in the time of Augustus"; Thomas disputes that the settlement only dates
    to the end of the 2nd century BCE. p. 190: Arachosia described as "the Helmund
    valley and the district between that river and the Indus". Over a century old:
    check how later scholarship treats Thomas's early-settlement argument.
