summary: >
  A scholarly summary, in French, of Kuz'mina's The Origin of the Indo-Iranians
  (2007), setting out her model of Indo-Iranian and Iranian migrations from the
  Bronze Age steppe.
verification:
  status: unverified
  notes: >
    Read 2026-11-28 (OpenEdition; CC BY-SA 4.0). § 1: Kuz'mina locates the origin of
    Indo-Iranian migrations (rejecting the notion of "invasions") in the steppe cultures formed
    at the turn of the 3rd and 2nd millennia: the Timber-grave culture (Ukraine, Urals) and the
    Andronovo culture (Kazakhstan, southern Siberia). Part 3: break-up of Indo-Iranian unity
    c. 1700–1400 BCE from an undifferentiated stage attested at Sintashta; Indo-Aryan migrations
    from several Andronovo centres. Part 4: Iranian migration from the Timber-grave culture from
    the 13th c.; a split within the east-Iranian linguistic community between steppe nomads
    ("ancêtres des Scythes") and groups migrating south who imposed their language on settled
    communities; settlement of the east-Iranian peoples complete by the 9th–8th c. § 2:
    critical discussion of Sarianidi's claims of an Indo-Iranian, "proto-Zoroastrian" BMAC.
