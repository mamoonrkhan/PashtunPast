{# The search and filter bar shared by Claims, Timeline and Map.
   Search is always visible; the other filters sit under "More filters" to keep
   the page calm. filters.js reads and applies them, and opens "More filters"
   when a filter is already set from the page address. #}
<form class="filters" id="filters" role="search" onsubmit="return false">
  <label class="grow">Search
    <input type="search" name="q" placeholder="Try: Paktyes, Scythians, Bactria, DNA…">
  </label>
  <details class="more-filters" id="more-filters">
    <summary>More filters</summary>
    <div class="filter-row">
      <label>People or group
        <select name="population">
          <option value="">All</option>
          {% for p in m.populations.values() | sort(attribute="name") %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
      </label>
      <label>Time period
        <select name="period">
          <option value="">All</option>
          {% for p in m.periods.values() %}<option value="{{ p.id }}">{{ p.label }}</option>{% endfor %}
        </select>
      </label>
      <label>Kind of evidence
        <select name="level">
          <option value="">All</option>
          {% for l in m.levels %}<option value="{{ l.id }}">{{ l.get("plain", l.label) }}</option>{% endfor %}
        </select>
      </label>
      <label>How sure
        <select name="strength">
          <option value="">All</option>
          {% for s, v in m.strengths.items() %}<option value="{{ s }}">{{ v.label }}</option>{% endfor %}
        </select>
      </label>
      <label>Topic
        <select name="category">
          <option value="">All</option>
          {% for k, v in m.categories.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
        </select>
      </label>
      <button type="reset" class="link-button">Clear all</button>
    </div>
  </details>
  <p class="filter-count" id="filter-count" aria-live="polite"></p>
</form>
